# Example GitHub Actions release workflow that builds + validates + promotes a
# context snapshot on tag push. Wire your real deploy/health steps into the
# marked spots. Secrets come from repo/environment secrets — never hard-coded.
name: ctxd release

on:
  push:
    tags:
      - "v*"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tag history to compute --previous

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Validate agent benchmark format
        run: node dist/cli.js benchmark validate examples/benchmark.json examples/benchmark-observations.json

      - name: Compare context-layer benchmark against direct-schema baseline
        run: node dist/cli.js benchmark compare examples/benchmark.json examples/benchmark-direct-observations.json examples/benchmark-context-observations.json

      - name: Build snapshot for the pushed tag
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_INSTANCE: production
        run: |
          RELEASE="${GITHUB_REF_NAME}"
          PREVIOUS="$(git describe --tags --abbrev=0 "${RELEASE}^" 2>/dev/null || true)"
          node dist/cli.js snapshot build --release "$RELEASE" --git-commit "$GITHUB_SHA" ${PREVIOUS:+--previous "$PREVIOUS"}
          node dist/cli.js release-gate --release "$RELEASE" ${PREVIOUS:+--previous "$PREVIOUS"} --benchmark examples/benchmark.json --observations examples/benchmark-observations.json
          node dist/cli.js snapshot publish --release "$RELEASE"

      # ---- deploy your application here ----
      # - name: Deploy
      #   run: ./deploy/production.sh
      # - name: Health check
      #   run: ./deploy/healthcheck.sh

      - name: Promote snapshot to current (only after deploy + health pass)
        run: node dist/cli.js snapshot promote --release "${GITHUB_REF_NAME}"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-snapshot-${{ github.ref_name }}
          path: snapshots/${{ github.ref_name }}/
